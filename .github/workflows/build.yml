name: Build ML Artifacts
on:
  push:
    branches: [main]
    paths:
      - train.py
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Train and evaluate models
        run: python train.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: credit-risk-ml-outputs
          path: outputs/
          retention-days: 30
